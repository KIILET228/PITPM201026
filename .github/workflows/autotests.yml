name: .NET Regression Tests (Preview)

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем .NET. 
      # ВАЖНО: include-prerelease: true обязателен для .NET 10
      # Если у тебя в global.json указана конкретная версия (например, 10.0.100-preview...),
      # лучше заменить '10.0.x' на эту точную строку без суффикса x.
      - name: Setup .NET (Preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302' 
          include-prerelease: true

      # 3. Восстанавливаем зависимости (NuGet пакеты)
      # Кэширование можно добавить позже, если сборка будет слишком долгой
      - name: Restore dependencies
        run: dotnet restore

      # 4. Собираем решение. 
      # ЗАМЕНИ MySolution.sln на имя твоего файла решения!
      - name: Build solution
        run: dotnet build ValidationLibrary.sln --no-restore --configuration Release

      # 5. Запускаем тесты. 
      # Тесты тоже берутся из того же .sln файла
      - name: Run tests
        run: dotnet test MySolution.sln --no-build --configuration Release --verbosity normal
