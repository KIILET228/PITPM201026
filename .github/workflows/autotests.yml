name: .NET Regression Tests (Preview)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check file exists (debug)
        run: ls -la ValidationLibrary/

      - name: Setup .NET (Preview)
        uses: actions/setup-dotnet@v4
        with:
          # !!! ВСТАВЬ СЮДА ПОЛНУЮ ВЕРСИЮ ИЗ dotnet --list-sdks !!!
          # Пример: 10.0.100-preview.5.25307.4
          dotnet-version: '10.0.302'
          include-prerelease: true

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        # Путь с прямым слэшем и правильным расширением
        run: dotnet build ValidationLibrary/ValidationLibrary.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ValidationLibrary/ValidationLibrary.sln --no-build --configuration Release --verbosity normal
